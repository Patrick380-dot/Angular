<main class="add-page">
  <section class="add-card" aria-labelledby="add-title">
    <p class="add-eyebrow">La Bonne Affaire</p>
    <h1 id="add-title">Ajouter un article</h1>
    <p class="add-description">Renseignez les informations principales de votre annonce.</p>

    <form class="add-form" (ngSubmit)="onSubmit(f)" #f="ngForm">
      <div class="form-field">
        <label for="article-title">Titre</label>
        <input
          id="article-title"
          name="title"
          type="text"
          placeholder="Ex. Vélo de ville"
          autocomplete="off"
          required
          [(ngModel)]="titleToAdd"
        />
      </div>

      <div class="form-field">
        <label for="article-price">Prix</label>
        <div class="price-input">
          <input
            id="article-price"
            name="price"
            type="number"
            min="0"
            step="0.01"
            placeholder="0,00"
            required
            [(ngModel)]="priceToAdd"
          />
          <span aria-hidden="true">$</span>
        </div>
      </div>

      <button class="add-button" type="submit">Ajouter l’article</button>
    </form>
  </section>
</main>
