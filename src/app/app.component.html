<main>
  <nav class="navbar sm:navbar-expand bg-1 fg-2">
    <div class="container-fluid">
      <h1 class="nav_title">La Bonne Affaire</h1>
      <button
        class="btn-icon navbar-toggler"
        type="button"
        data-bs-toggle="drawer"
        data-bs-target="#navbarNavAltMarkup"
        aria-controls="navbarNavAltMarkup"
        aria-expanded="false"
        aria-label="Toggle navigation"
      >
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog
        class="drawer drawer-end"
        tabindex="-1"
        id="navbarNavAltMarkup"
        aria-labelledby="navbarNavAltMarkupLabel"
      >
        <div class="drawer-header">
          <h5 class="drawer-title" id="navbarNavAltMarkupLabel">Menu</h5>
          <button
            type="button"
            class="btn-close"
            data-bs-dismiss="drawer"
            aria-label="Close"
          ></button>
        </div>
        <div class="drawer-body">
          <div class="nav nav-pills navbar-nav">
            <a class="nav-link active" aria-current="page" href="#">Home</a>
            <a class="nav-link" href="#">Features</a>
            <a class="nav-link" href="#">Pricing</a>
            <a class="nav-link disabled" aria-disabled="true">Disabled</a>
          </div>
        </div>
      </dialog>
    </div>
  </nav>

  <div class="alertNsg">
    <p>
      {{message}}
    </p>
  </div>

  <div class="card">

    <app-articles
      *ngFor = "let element of liste"
      [titreCarte]="element.titreCarte"
      [prix]="element.prix"
      [description]="element.description"
      [urlImg]="element.urlImg"
      [textAltImg]="element.textAltImg"
      [dispo]="element.dispo"
      (info)="onAffiche($event)"
    ></app-articles>
  </div>

  <footer>
    <div class="container">
      <p>&copy; 2024 La Bonne Affaire. All rights reserved.</p>
    </div>
  </footer>
</main>
